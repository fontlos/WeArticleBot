[workspace]
members = [
    "crates/bot",
    "crates/cimi",
    "crates/lark",
    "crates/wechat",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Fontlos <fontlos@fontlos.com>"]

[workspace.dependencies]
cimi = { path = "crates/cimi" }
lark = { path = "crates/lark" }
wechat = { path = "crates/wechat" }

arc-swap = "1.9.2"
bytes = "1.12.1"
log = "0.4.33"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = "1.53.1"
tokio-util = "0.7.19"
